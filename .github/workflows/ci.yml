name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; individual jobs widen it when needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -q --cov=skillforge --cov-report=term-missing --cov-report=xml
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: pytest -q
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  demo:
    name: Demo workflow (no API key)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Analyze, generate, validate, export
        run: |
          skillforge analyze examples/fastapi-demo --json > analysis.json
          skillforge generate examples/fastapi-demo
          skillforge validate examples/fastapi-demo
          skillforge export examples/fastapi-demo --to all
          python -c "import json; d=json.load(open('analysis.json')); assert d['plan']['candidates'], 'no skills planned'"
      - name: Assert generation was deterministic and offline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("examples/fastapi-demo/.skills").glob("*/.skillforge.json"))
          assert manifests, "no generated skills found"
          for path in manifests:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["mode"] == "deterministic", (str(path), data["mode"])
              assert not data.get("provider"), (str(path), data.get("provider"))
          print(f"{len(manifests)} skills generated deterministically without a provider")
          PY
      - name: Reproducibility check
        run: |
          skillforge generate examples/fastapi-demo --force
          skillforge validate examples/fastapi-demo
      - name: Benchmark scenarios
        run: skillforge eval --repo .

  build:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the wheel installs and ships every template
        run: |
          python -m pip install --force-reinstall dist/*.whl
          skillforge --version
          sf --version
          python - <<'PY'
          import pathlib

          import skillforge

          root = pathlib.Path(skillforge.__file__).parent / "templates"
          skills = sorted(path.name for path in (root / "skills").glob("*.j2"))
          scripts = sorted(path.name for path in (root / "scripts").glob("*.py"))
          assert len(skills) == 10, skills
          assert len(scripts) == 6, scripts
          print("templates:", skills)
          print("scripts:", scripts)
          PY
          skillforge doctor --json > /dev/null
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  llm-integration:
    name: LLM integration (optional, manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual only: live provider calls must never gate a normal run. The test
    # skips itself when the key is absent, so this job is safe to trigger
    # without secrets configured.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[llm,dev]"
      - name: Run live provider tests
        run: pytest -q -m llm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKILLFORGE_TEST_MODEL: ${{ vars.SKILLFORGE_TEST_MODEL }}
