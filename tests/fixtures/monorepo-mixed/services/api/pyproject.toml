[project]
name = "monorepo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
