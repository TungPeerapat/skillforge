# Curated official-source authority map (v0.3, K3).
#
# Every entry is evidence-backed by a human review: the official repository,
# release/tag convention, and documentation hosts for one package. SkillForge
# never fetches anything in K3; this table generates *candidate* URLs only,
# and every candidate still passes OfficialSourcePolicy (HTTPS, host
# verification, community denylist) before it is recorded as accepted.
#
# Keys per entry:
#   ecosystem, package        required; "package" is the lowercase package name
#   hosts                     hosts owned by the project (subdomains allowed)
#   repository                official source repository
#   tag_template              URL template for the exact release tag
#                             placeholders: {version}, {version_dashed}
#   docs / api / changelog / migration          latest-version URLs
#   docs_version_template / api_version_template
#                             versioned URLs; placeholders:
#                             {version}, {major}, {minor}, {version_dashed}

version = "2026-10-04"

[[entry]]
ecosystem = "pypi"
package = "fastapi"
hosts = ["fastapi.tiangolo.com"]
repository = "https://github.com/fastapi/fastapi"
tag_template = "https://github.com/fastapi/fastapi/releases/tag/{version}"
docs = "https://fastapi.tiangolo.com/"
api = "https://fastapi.tiangolo.com/reference/"
changelog = "https://fastapi.tiangolo.com/release-notes/"

